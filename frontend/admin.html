<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodShare Admin Dashboard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f7f4;
  margin: 0;
  padding: 25px;
  color: #26352b;
}
.container {
  max-width: 950px;
  margin: auto;
}
h1 { color: #18834b; }
.panel {
  background: white;
  padding: 22px;
  border-radius: 12px;
  margin: 20px 0;
  box-shadow: 0 2px 10px #0001;
}
input {
  padding: 12px;
  width: 65%;
  max-width: 350px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  padding: 11px 16px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  background: #18834b;
  color: white;
  margin: 5px;
}
button:disabled { opacity: .6; cursor: wait; }
.donation {
  background: #f8faf8;
  border: 1px solid #ddd;
  padding: 16px;
  border-radius: 9px;
  margin: 12px 0;
}
.status { font-weight: bold; }
.collected { color: #18834b; }
.available { color: #b7791f; }
.message { margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>FoodShare Admin Dashboard</h1>
  <p>Manage food donations and collection status.</p>

  <div class="panel">
    <h3>Admin Login</h3>
    <input type="password" id="password"
      placeholder="Enter admin password">
    <button onclick="loadDonations()">Login / Load Donations</button>
    <p id="message" class="message"></p>
  </div>

  <div class="panel">
    <h2>All Donations</h2>
    <div id="donations">Please log in to view donations.</div>
  </div>
</div>

<script>
let adminPassword = "";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function loadDonations() {
  adminPassword = document.getElementById("password").value;

  if (!adminPassword) {
    document.getElementById("message").textContent =
      "Please enter the admin password.";
    return;
  }

  const message = document.getElementById("message");
  const area = document.getElementById("donations");

  message.textContent = "Loading...";
  area.textContent = "";

  try {
    const response = await fetch("/api/admin/donations", {
      headers: { "X-Admin-Password": adminPassword }
    });

    if (response.status === 401) {
      message.textContent = "Incorrect admin password.";
      return;
    }

    if (!response.ok) throw new Error("Could not load donations.");

    const result = await response.json();
    const donations = result.donations || [];
    message.textContent = "Admin access successful.";

    if (!donations.length) {
      area.textContent = "No donations found.";
      return;
    }

    area.innerHTML = donations.map(d => `
      <div class="donation">
        <h3>${escapeHTML(d.food)}</h3>
        <p><b>Donor:</b> ${escapeHTML(d.name)}</p>
        <p><b>Quantity:</b> ${escapeHTML(d.quantity)}</p>
        <p><b>Location:</b> ${escapeHTML(d.location)}</p>
        <p class="status ${d.status === "collected" ? "collected" : "available"}">
          Status: ${escapeHTML(d.status)}
        </p>
        ${d.status === "available"
          ? `<button onclick="markCollected('${encodeURIComponent(d.id)}', this)">
               Mark as Collected
             </button>`
          : "<p>Collection completed. Automatic deletion is scheduled.</p>"
        }
      </div>
    `).join("");

  } catch (error) {
    message.textContent = error.message;
  }
}

async function markCollected(encodedId, button) {
  if (!confirm("Confirm that this donation has been collected?")) return;

  button.disabled = true;
  button.textContent = "Updating...";

  try {
    const id = decodeURIComponent(encodedId);
    const response = await fetch(
      "/api/admin/donations/" + encodeURIComponent(id) + "/collect",
      {
        method: "PATCH",
        headers: { "X-Admin-Password": adminPassword }
      }
    );

    if (!response.ok) throw new Error("Could not update donation.");

    alert("Donation marked as collected!");
    await loadDonations();

  } catch (error) {
    alert(error.message);
    button.disabled = false;
    button.textContent = "Mark as Collected";
  }
}
</script>
</body>
</html>
